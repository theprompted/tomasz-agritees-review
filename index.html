const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iters, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
    let html = new TextDecoder().decode(plain);
    // Pin relative image paths to this page's directory: parsing the string
    // into a fresh document resets how relative URLs resolve.
    const dir = location.href.replace(/[^/]*$/, '');
    html = html.replace(/<head(\s[^>]*)?>/i, m => m + '<base href="' + dir + '">');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.replaceChild(
      document.importNode(doc.documentElement, true),
      document.documentElement);
    // <style> survives importNode; re-run nothing else, the page is static.
  } catch (_) {
    err.textContent = 'That password didn\'t work. Check the message and try again.';
